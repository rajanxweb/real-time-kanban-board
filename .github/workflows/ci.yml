name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kanban_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kanban_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kanban_ci?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kanban_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/kanban_test?schema=public
      JWT_SECRET: ci-only-test-secret
      CLIENT_ORIGIN: http://localhost:5173

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Create isolated server test database
        run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -c 'CREATE DATABASE kanban_test'

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Typecheck client
        working-directory: client
        run: npm run typecheck

      - name: Test client
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Lint server
        working-directory: server
        run: npm run lint

      - name: Typecheck server
        working-directory: server
        run: npm run typecheck

      - name: Test server
        working-directory: server
        run: npm test

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Build server Docker image
        run: docker build --tag kanban-server-ci ./server

      - name: Build client Docker image
        run: docker build --tag kanban-client-ci ./client
